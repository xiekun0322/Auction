<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>运营后台</title>
<style>
body{font-family:Arial;margin:0;background:#f5f6f8}
.nav{background:#2c3e50;color:#fff;padding:14px 24px}
.container{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
th{background:#fafafa}
button{padding:6px 12px;background:#e74c3c;color:#fff;border:0;border-radius:4px;cursor:pointer}
</style></head>
<body>
<div class="nav">司法拍卖 · 运营 <a href="/api/logout" style="color:#fff;float:right">退出</a></div>
<div class="container"><div class="card">
<h3>标的物</h3>
<table><thead><tr><th>ID</th><th>案号</th><th>标题</th><th>当前价</th><th>领先者</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="tb"></tbody></table>
</div></div>
<script>
async function load(){
  const r=await fetch('/api/auction/items');const j=await r.json();
  document.getElementById('tb').innerHTML=j.data.map(it=>`<tr>
    <td>${it.id}</td><td>${it.caseNo}</td><td>${it.title}</td>
    <td>￥${it.currentPrice}</td><td>${it.leaderId||'-'}</td><td>${it.status}</td>
    <td><button onclick="endIt(${it.id})">强制落槌</button></td></tr>`).join('');
}
async function endIt(id){if(!confirm('确认落槌？'))return;
  const r=await fetch('/api/auction/end/'+id,{method:'POST'});const j=await r.json();
  alert(j.code===0?'落槌成功':j.msg);load();}
load();
</script>
</body></html>
