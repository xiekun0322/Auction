server:
  port: 8081
spring:
  application:
    name: auction-user
  datasource:
    url: jdbc:h2:mem:userdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
  sql.init.mode: always
  h2.console.enabled: true
mybatis.configuration.map-underscore-to-camel-case: true
logging.level.com.judicial: DEBUG