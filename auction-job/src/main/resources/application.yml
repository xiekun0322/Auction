server.port: 8085
spring:
  application.name: auction-job
  datasource:
    url: jdbc:h2:mem:jobdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
  sql.init.mode: always
mybatis.configuration.map-underscore-to-camel-case: true

feign:
  user-url: http://localhost:8081
  auction-url: http://localhost:8082
  order-url: http://localhost:8084